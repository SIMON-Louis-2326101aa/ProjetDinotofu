name: Dinotofu CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Restore executable scripts
        run: chmod +x scripts/*.sh tools/linux/*.sh || true

      - name: Validate source tree
        run: bash scripts/validate_release_tree.sh --skip-branding

      - name: Build and run tests
        env:
          DINOTOFU_TEST_JOBS: "4"
        run: make -j2 test
