name: Dinotofu CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tree:
    name: Validate Project Tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Validate Release Tree & Branding
        run: |
          ./scripts/validate_release_tree.sh
          ./scripts/validate_branding_assets.sh

  build-linux:
    name: Build & Smoke Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build Dinotofu
        run: make -j$(nproc) TARGET_ARCH=x86-64 OPT_LEVEL=-O3

      - name: Test Strip Target
        run: make strip

      - name: Smoke Test (CLI Flags)
        run: |
          ./output/Dinotofu --version
          ./output/Dinotofu --encoding-check

  build-windows:
    name: Cross-Compile (Windows MinGW)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64

      - name: Build Dinotofu Windows
        run: |
          make -j$(nproc) \
            CXX="x86_64-w64-mingw32-g++" \
            APP_NAME="Dinotofu.exe" \
            TARGET_ARCH="x86-64" \
            OPT_LEVEL="-O3" \
            CXXFLAGS="-std=c++17 -O3 -march=x86-64 -pipe -Wall -Wextra -Iinclude -MMD -MP -finput-charset=UTF-8 -fexec-charset=UTF-8" \
            LDFLAGS="-s -static -static-libgcc -static-libstdc++"

      - name: Verify Windows executable
        run: |
          test -s output/Dinotofu.exe
          x86_64-w64-mingw32-strip --strip-all output/Dinotofu.exe
          ls -lh output/Dinotofu.exe
