name: Build and Publish Dinotofu Releases

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: "Recreer ou reparer la release meme si le tag de version existe deja"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: dinotofu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      should_publish: ${{ steps.prepare.outputs.should_publish }}
      reason: ${{ steps.prepare.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Decide release tag and repair needs
        id: prepare
        env:
          FORCE_RELEASE: ${{ github.event.inputs.force_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(./scripts/get_version.sh)"
          TAG="v${VERSION}"
          SHOULD_PUBLISH="false"
          REASON=""

          REQUIRED_ASSETS=(
            "Dinotofu-Windows-v${VERSION}.zip"
            "DinotofuInstaller-Windows-v${VERSION}.zip"
            "Dinotofu-Linux-v${VERSION}.zip"
            "DinotofuInstaller-Linux-v${VERSION}.zip"
          )

          echo "Version detectee dans le code : ${VERSION}"
          echo "Tag attendu : ${TAG}"

          TAG_EXISTS="false"
          RELEASE_EXISTS="false"
          RELEASE_HAS_REQUIRED_ASSETS="false"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS="true"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS="true"
          fi

          if [[ "${RELEASE_EXISTS}" == "true" ]]; then
            ASSET_NAMES="$(gh release view "${TAG}" --json assets --jq '.assets[].name' || true)"
            echo "Assets deja presents dans ${TAG} :"
            printf '%s\n' "${ASSET_NAMES:-aucun}"

            missing=0
            for required in "${REQUIRED_ASSETS[@]}"; do
              if ! printf '%s\n' "${ASSET_NAMES}" | grep -Fxq "${required}"; then
                echo "Asset manquant : ${required}"
                missing=$((missing + 1))
              fi
            done

            if [[ "${missing}" -eq 0 ]]; then
              RELEASE_HAS_REQUIRED_ASSETS="true"
            fi
          fi

          if [[ "${TAG_EXISTS}" == "false" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Dinotofu ${TAG}"
            git push origin "${TAG}"
            SHOULD_PUBLISH="true"
            REASON="nouveau tag ${TAG} cree automatiquement depuis la version du code"
          elif [[ "${FORCE_RELEASE:-false}" == "true" ]]; then
            SHOULD_PUBLISH="true"
            REASON="force_release demande : reconstruction des assets de ${TAG}"
          elif [[ "${RELEASE_EXISTS}" == "false" ]]; then
            SHOULD_PUBLISH="true"
            REASON="le tag ${TAG} existe deja mais la release GitHub manque"
          elif [[ "${RELEASE_HAS_REQUIRED_ASSETS}" == "false" ]]; then
            SHOULD_PUBLISH="true"
            REASON="la release ${TAG} existe mais il manque au moins un ZIP Windows/Linux jouable"
          else
            SHOULD_PUBLISH="false"
            REASON="le tag ${TAG} et les ZIP Windows/Linux attendus existent deja"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "Decision : ${SHOULD_PUBLISH} (${REASON})"

  no-release-needed:
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.should_publish != 'true'
    steps:
      - name: Nothing to publish
        run: |
          echo "Aucune release generee."
          echo "Raison : ${{ needs.prepare-release.outputs.reason }}"
          echo "Pour publier une nouvelle release automatiquement, augmente la version dans src/core/VersionInfo.cpp puis push sur main/master."

  build-linux:
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.should_publish == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Package Linux release and installer
        env:
          DINOTOFU_REPO: ${{ github.repository }}
        run: |
          ./scripts/package_linux_release.sh
          ./scripts/package_linux_installer.sh

      - name: Upload Linux game artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dinotofu-Linux-v${{ needs.prepare-release.outputs.version }}
          path: release_packages/Dinotofu-Linux-v${{ needs.prepare-release.outputs.version }}.zip

      - name: Upload Linux installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinotofuInstaller-Linux-v${{ needs.prepare-release.outputs.version }}
          path: release_packages/DinotofuInstaller-Linux-v${{ needs.prepare-release.outputs.version }}.zip

  build-windows:
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.should_publish == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64 zip

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Package Windows release and installer
        env:
          DINOTOFU_REPO: ${{ github.repository }}
        run: ./scripts/package_windows_release.sh

      - name: Upload Windows game artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dinotofu-Windows-v${{ needs.prepare-release.outputs.version }}
          path: release_packages/Dinotofu-Windows-v${{ needs.prepare-release.outputs.version }}.zip

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinotofuInstaller-Windows-v${{ needs.prepare-release.outputs.version }}
          path: release_packages/DinotofuInstaller-Windows-v${{ needs.prepare-release.outputs.version }}.zip

  publish-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-linux, build-windows]
    if: needs.prepare-release.outputs.should_publish == 'true'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_upload
          merge-multiple: true

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_REASON: ${{ needs.prepare-release.outputs.reason }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          ls -la release_upload
          files=(release_upload/*.zip)
          if (( ${#files[@]} == 0 )); then
            echo "::error::Aucun ZIP trouve dans release_upload. Publication annulee."
            exit 1
          fi

          cat > release_notes.md <<EOF
          Dinotofu ${RELEASE_TAG}

          Publication automatique depuis le depot source.

          Raison : ${RELEASE_REASON}

          Fichiers utiles :
          - Dinotofu-Windows-v${RELEASE_VERSION}.zip : jeu Windows pret a lancer.
          - DinotofuInstaller-Windows-v${RELEASE_VERSION}.zip : installer/launcher Windows.
          - Dinotofu-Linux-v${RELEASE_VERSION}.zip : jeu Linux pret a lancer.
          - DinotofuInstaller-Linux-v${RELEASE_VERSION}.zip : installer/launcher Linux.
          EOF

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber --repo "${GH_REPO}"
            gh release edit "${RELEASE_TAG}" --title "Dinotofu ${RELEASE_TAG}" --notes-file release_notes.md --repo "${GH_REPO}"
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --title "Dinotofu ${RELEASE_TAG}" \
              --notes-file release_notes.md \
              --repo "${GH_REPO}"
          fi
